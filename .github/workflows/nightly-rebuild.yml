# 日次リビルド＋Pages配信: main への push・毎日 03:xx JST・手動の3経路で build → test → deploy-pages。
# 締切超過の自動降格は build.mjs がビルド時にメモリ上で判定する（data/*.json は変更しない）。
name: Build and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.repository }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7
        with:
          path: art-koubo-site

      - name: Checkout sister grant data
        # build.mjs は隣接する ../stage-grants-site/data/programs.data.json を読む。
        uses: actions/checkout@v7
        with:
          repository: aratama-ship-it/stage-grants
          path: stage-grants-site

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Prepare artifact directory
        run: |
          mkdir -p art-koubo-site/_site
          cp -R art-koubo-site/assets art-koubo-site/_site/assets
          cp art-koubo-site/CNAME art-koubo-site/_site/CNAME

      - name: Build
        working-directory: art-koubo-site
        env:
          BUILD_OUTPUT_DIR: _site
          BUILD_SHA: ${{ github.sha }}
        run: node build.mjs

      - name: Test
        working-directory: art-koubo-site
        run: node --test tests/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: art-koubo-site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
